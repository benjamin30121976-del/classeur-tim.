name: Audit Parent des rattachements PDF mathématiques
on:
  pull_request:
    paths:
      - 'maths-pdf-bulk-import.js'
      - 'outils/auditer-rattachements-maths-parent.cjs'
      - '.github/workflows/auditer-rattachements-maths-parent.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TIM_PARENT_EMAIL: ${{ secrets.TIM_PARENT_EMAIL }}
      TIM_PARENT_PASSWORD: ${{ secrets.TIM_PARENT_PASSWORD }}
      TIM_SITE_URL: https://classeur-tim-v16.pages.dev/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Valider la syntaxe de l'import
        run: |
          node --check maths-pdf-bulk-import.js
          node --check outils/auditer-rattachements-maths-parent.cjs
      - name: Vérifier les secrets Parent sans les afficher
        run: test -n "$TIM_PARENT_EMAIL" && test -n "$TIM_PARENT_PASSWORD"
      - name: Installer Chromium
        run: |
          npm install --prefix /tmp/tim-math-pdf-check --no-audit --no-fund playwright
          if ! command -v google-chrome >/dev/null 2>&1 && ! command -v chromium >/dev/null 2>&1; then
            /tmp/tim-math-pdf-check/node_modules/.bin/playwright install --with-deps chromium
          fi
      - name: Valider les correspondances exactes des cours sur Firebase en lecture seule
        env:
          NODE_PATH: /tmp/tim-math-pdf-check/node_modules
        run: node outils/auditer-rattachements-maths-parent.cjs
