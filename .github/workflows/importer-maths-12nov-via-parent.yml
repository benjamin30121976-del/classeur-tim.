name: Importer les exercices maths du 12 novembre par Parent
on:
  push:
    branches: [main]
    paths:
      - 'maths-12nov-training.mjs'
      - 'tools/test/maths-12nov-training.test.mjs'
      - 'outils/publier-maths-12nov-via-parent.cjs'
      - '.github/workflows/importer-maths-12nov-via-parent.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  import-parent:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TIM_PARENT_EMAIL: ${{ secrets.TIM_PARENT_EMAIL }}
      TIM_PARENT_PASSWORD: ${{ secrets.TIM_PARENT_PASSWORD }}
      TIM_SITE_URL: https://classeur-tim-v16.pages.dev/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Valider les 30 énoncés et corrigés sans inscription
        run: |
          node --check maths-12nov-training.mjs
          node --check outils/publier-maths-12nov-via-parent.cjs
          node --test tools/test/maths-12nov-training.test.mjs
      - name: Vérifier le compte Parent
        run: |
          test -n "$TIM_PARENT_EMAIL" || { echo "::error::Connexion Parent manquante"; exit 1; }
          test -n "$TIM_PARENT_PASSWORD" || { echo "::error::Connexion Parent manquante"; exit 1; }
      - name: Installer Chromium
        run: |
          mkdir -p /tmp/tim-math12
          npm install --prefix /tmp/tim-math12 --no-audit --no-fund playwright
          /tmp/tim-math12/node_modules/.bin/playwright install --with-deps chromium
      - name: Importer par le compte Parent dans Firestore
        env:
          NODE_PATH: /tmp/tim-math12/node_modules
        run: node outils/publier-maths-12nov-via-parent.cjs
