name: Tester collecteur ENT sans identifiants
on:
  push:
    paths:
      - scripts/tim_ent_collect.py
      - tools/test_tim_ent_collect.py
      - .github/workflows/test-ent-collecte-unitaire.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tools -p test_tim_ent_collect.py -v
