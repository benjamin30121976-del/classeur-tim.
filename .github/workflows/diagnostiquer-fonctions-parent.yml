name: Diagnostic lecture seule du service Parent Firebase
on:
  pull_request:
    paths:
      - 'outils/diagnostic-fonctions-parent.cjs'
      - '.github/workflows/diagnostiquer-fonctions-parent.yml'
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TIM_PARENT_EMAIL: ${{ secrets.TIM_PARENT_EMAIL }}
      TIM_PARENT_PASSWORD: ${{ secrets.TIM_PARENT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier présence des identifiants Parent sans les afficher
        run: |
          test -n "$TIM_PARENT_EMAIL"
          test -n "$TIM_PARENT_PASSWORD"
      - name: Installer le navigateur de diagnostic
        run: |
          mkdir -p /tmp/tim-fn-diag
          npm install --prefix /tmp/tim-fn-diag --no-audit --no-fund playwright
          /tmp/tim-fn-diag/node_modules/.bin/playwright install --with-deps chromium
      - name: Tester en lecture seule getParentReport et App Check
        env:
          NODE_PATH: /tmp/tim-fn-diag/node_modules
        run: node outils/diagnostic-fonctions-parent.cjs
