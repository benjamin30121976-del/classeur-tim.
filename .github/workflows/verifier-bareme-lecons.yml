name: Contrôle barème XP des exercices des leçons
on:
  push:
    branches: [main, audit-correction-immediate-20261113]
    paths:
      - 'functions/xp.mjs'
      - 'functions/test/xp.test.mjs'
      - 'functions/spanish-nov12-training.mjs'
      - 'functions/test/spanish-nov12-training.test.mjs'
      - 'espagnol-12nov-correction.mjs'
      - 'espagnol-simplifie.js'
      - 'espagnol-training-ui.js'
      - 'maths-12nov-training.mjs'
      - 'tools/test/maths-12nov-training.test.mjs'
      - 'maths-12nov-ui.js'
      - 'maths-parcours.js'
      - 'worker/server.mjs'
      - 'worker/spanish-lesson-xp.mjs'
      - 'worker/test/lesson-training-xp.test.mjs'
      - 'xp-rules.js'
      - 'app.js'
      - 'boot.js'
      - '.github/workflows/verifier-bareme-lecons.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sans-note-reelle:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Contrôler les fichiers exécutés sur le site
        run: |
          node --check functions/xp.mjs
          node --check worker/server.mjs
          node --check worker/spanish-lesson-xp.mjs
          node --check espagnol-simplifie.js
          node --check espagnol-training-ui.js
          node --check maths-12nov-ui.js
          node --check maths-parcours.js
          node --check maths-12nov-training.mjs
          node --check xp-rules.js
          node --check boot.js
          node --check app.js
      - name: Tester +1 / +0,5 / 0 XP pour espagnol, maths, physique-chimie
        run: |
          node --test functions/test/xp.test.mjs functions/test/spanish-nov12-training.test.mjs tools/test/maths-12nov-training.test.mjs worker/test/lesson-training-xp.test.mjs worker/test/spanish-parent-preview.test.mjs worker/test/math-training.test.mjs worker/test/physics-training.test.mjs
      - name: Résumé
        run: echo 'Barème vérifié sans connexion Parent ou Tim, sans soumettre aucun exercice.' >> "$GITHUB_STEP_SUMMARY"
