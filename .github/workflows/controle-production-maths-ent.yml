name: Contrôle production — Mathématiques et Espagnol pédagogiques
on:
  pull_request:
    paths:
      - '.github/workflows/controle-production-maths-ent.yml'
      - 'outils/verifier-version-production-maths-espagnol.cjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/controle-production-maths-ent.yml'
      - 'maths-ent-exercices.js'
      - 'maths-parcours.js'
      - 'app.js'
      - 'boot.js'
      - 'guest-access.js'
      - 'index.html'
      - 'parent-unified-results.js'
      - 'worker/server.mjs'
      - 'worker/math-ent-training.mjs'
      - 'espagnol-simplifie.js'
      - 'espagnol-ent-exact.js'
      - 'tim-inline-ent-documents.js'
      - 'outils/verifier-version-production-maths-espagnol.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  controler:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Contrôler les vrais modules publiés sans anciennes versions figées
        run: node outils/verifier-version-production-maths-espagnol.cjs
      - name: Vérifier la non-publication du corrigé et du stockage privé
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://classeur-tim-v16.pages.dev"
          for path in /worker/math-ent-training.mjs /worker/physics-ent-training.mjs; do
            code=$(curl -sS -o /tmp/private-file -w '%{http_code}' --max-time 20 "$BASE$path")
            test "$code" = "404"
          done
          echo "Les corrigés restent côté Worker et ne sont pas accessibles par URL."
