name: Vérifier les mathématiques et XP privé
on:
  pull_request:
    paths:
      - 'maths-private-import.js'
      - 'maths-parcours.js'
      - 'maths-parcours.css'
      - 'worker/maths-training-curriculum.mjs'
      - 'worker/math-private-kv.mjs'
      - 'worker/maths-training-extra.mjs'
      - 'maths-bis-data.js'
      - 'worker/test/math-training.test.mjs'
      - 'worker/server.mjs'
      - 'boot.js'
      - 'app.js'
      - 'index.html'
      - 'tools/test/maths-parcours.test.mjs'
      - 'tools/diagnostic-cloudflare-kv.cjs'
      - '.github/workflows/verifier-mathematiques.yml'
  push:
    branches: [main]
    paths:
      - 'maths-parcours.js'
      - 'worker/maths-training-curriculum.mjs'
      - 'worker/maths-training-extra.mjs'
      - 'maths-bis-data.js'
      - 'worker/test/math-training.test.mjs'
      - 'worker/server.mjs'
      - 'tools/test/maths-parcours.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vérifier la syntaxe JavaScript
        run: |
          node --check maths-parcours.js
          node --check maths-private-import.js
          node --check worker/maths-training-curriculum.mjs
          node --check worker/math-private-kv.mjs
          node --check worker/maths-training-extra.mjs
          node --check maths-bis-data.js
          node --check worker/server.mjs
          node --check boot.js
          node --check app.js
      - name: Vérifier le barème et la communication Parent-Tim sans utiliser leurs comptes
        run: node --test tools/test/maths-parcours.test.mjs worker/test/math-training.test.mjs
      - name: Diagnostic Cloudflare KV des mathématiques (lecture seule)
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_READ_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_READONLY }}
        run: node tools/diagnostic-cloudflare-kv.cjs
