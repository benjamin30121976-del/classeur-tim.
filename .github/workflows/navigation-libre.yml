name: Audit sérieux du classeur du 13 novembre — lecture seule
on:
  push:
    branches: [audit-serieux-classeur-20261114]
    paths:
      - 'tools/test/audit-13nov-production.readonly.cjs'
      - '.github/workflows/navigation-libre.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspection:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TIM_PARENT_EMAIL: ${{ secrets.TIM_PARENT_EMAIL }}
      TIM_PARENT_PASSWORD: ${{ secrets.TIM_PARENT_PASSWORD }}
      TIM_SITE_URL: https://classeur-tim-v16.pages.dev/
    steps:
      - uses: actions/checkout@v4
      - name: Installer Chromium et Playwright
        run: |
          mkdir -p /tmp/tim-audit
          npm install --prefix /tmp/tim-audit --no-audit --no-fund playwright
          /tmp/tim-audit/node_modules/.bin/playwright install chromium
      - name: Auditer le site publié et la sécurité des exercices
        env:
          NODE_PATH: /tmp/tim-audit/node_modules
        run: node tools/test/audit-13nov-production.readonly.cjs
      - name: Archiver le bilan expurgé et captures publiques
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-tim-13nov-production
          path: audit-13nov-report/
          retention-days: 3
          if-no-files-found: warn
