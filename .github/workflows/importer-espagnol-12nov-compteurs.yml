name: Installer les compteurs de traduction du 12 novembre via Parent
on:
  push:
    branches: [main]
    paths:
      - 'functions/spanish-nov12-help-logging.mjs'
      - 'functions/test/spanish-nov12-help-logging.test.mjs'
      - 'outils/publier-espagnol-12nov-compteurs-parent.cjs'
      - '.github/workflows/importer-espagnol-12nov-compteurs.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  suivi-parent:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TIM_PARENT_EMAIL: ${{ secrets.TIM_PARENT_EMAIL }}
      TIM_PARENT_PASSWORD: ${{ secrets.TIM_PARENT_PASSWORD }}
      TIM_SITE_URL: https://classeur-tim-v16.pages.dev/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vérifier la sécurité, les points et le code
        run: |
          node --check functions/spanish-nov12-help-logging.mjs
          node --check outils/publier-espagnol-12nov-compteurs-parent.cjs
          node --test functions/test/spanish-nov12-translation-count.test.mjs functions/test/spanish-nov12-help-logging.test.mjs
      - name: Installer Chromium (sans TinyFish)
        run: |
          mkdir -p /tmp/tim-es12-help
          npm install --prefix /tmp/tim-es12-help --no-audit --no-fund playwright
          /tmp/tim-es12-help/node_modules/.bin/playwright install --with-deps chromium
      - name: Créer les emplacements privés de suivi via compte Parent
        env:
          NODE_PATH: /tmp/tim-es12-help/node_modules
        run: node outils/publier-espagnol-12nov-compteurs-parent.cjs
