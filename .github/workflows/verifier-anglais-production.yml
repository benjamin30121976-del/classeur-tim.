name: Vérifier anglais ENT et correction Parent en production
on:
  push:
    branches: [main]
    paths:
      - 'tools/test/anglais-production.readonly.cjs'
      - '.github/workflows/verifier-anglais-production.yml'
      - 'anglais-pack.js'
      - 'anglais-parcours.js'
      - 'anglais-exercices.js'
      - 'anglais-documents.js'
      - 'boot.js'
      - 'worker/english-training.mjs'
      - 'worker/server.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TIM_PARENT_EMAIL: ${{ secrets.TIM_PARENT_EMAIL }}
      TIM_PARENT_PASSWORD: ${{ secrets.TIM_PARENT_PASSWORD }}
      TIM_SITE_URL: https://classeur-tim-v16.pages.dev/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer navigateur Chromium
        run: |
          npm install --prefix /tmp/tim-english-readonly --no-audit --no-fund playwright
          /tmp/tim-english-readonly/node_modules/.bin/playwright install chromium
      - name: Lecture seule des 9 fichiers ENT et simulation Parent
        env:
          NODE_PATH: /tmp/tim-english-readonly/node_modules
        run: node tools/test/anglais-production.readonly.cjs
