name: Contrôle production Physique-chimie sans connexion
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/controle-production-physique.yml'
      - 'app.js'
      - 'boot.js'
      - 'guest-access.js'
      - 'index.html'
      - 'worker/server.mjs'
      - 'physique-chimie-*.js'
      - 'assets/vendor/pdfjs-3.2.146.min.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verifier-production:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Confirmer les nouveaux scripts réellement servis sur Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://classeur-tim-v16.pages.dev"
          ok=0
          for essai in $(seq 1 24); do
            curl -fsSL --max-time 20 "$BASE/" -o /tmp/pc-index.html || true
            curl -fsSL --max-time 20 "$BASE/physique-chimie-exercices.js?v=20261112-parent-essai-v3" -o /tmp/pc-exercises.js || true
            curl -fsSL --max-time 20 "$BASE/physique-chimie-parcours.js?v=20261112-parent-essai-v6" -o /tmp/pc-parcours.js || true
            curl -fsSL --max-time 20 "$BASE/boot.js?v=physique-parent-essai-20261112-v2" -o /tmp/pc-boot.js || true
            curl -fsSL --max-time 20 "$BASE/app.js?v=physique-parent-essai-menu-20261112-v4" -o /tmp/pc-app.js || true
            curl -fsSL --max-time 20 "$BASE/physique-chimie-documents.js?v=20261112-inline-pdf-ent-v3" -o /tmp/pc-documents.js || true
            curl -fsSL --max-time 20 "$BASE/physique-chimie-inline-pdf.js?v=20261112-inline-pdf-securise-v2" -o /tmp/pc-inline.js || true
            curl -fsSL --max-time 20 "$BASE/assets/vendor/pdfjs-3.2.146.min.js?v=physique-pdf-local-v1" -o /tmp/pc-pdfjs.js || true
            if grep -q 'physique-chimie-documents.js?v=20261112-inline-pdf-ent-v3' /tmp/pc-index.html 2>/dev/null &&
               grep -q 'physique-chimie-inline-pdf.js?v=20261112-inline-pdf-securise-v2' /tmp/pc-index.html 2>/dev/null &&
               grep -q 'isEvalSupported:false' /tmp/pc-inline.js 2>/dev/null &&
               test $(wc -c </tmp/pc-pdfjs.js) -gt 200000 &&
               grep -q 'physicsTrainingPreviewSubmit' /tmp/pc-exercises.js 2>/dev/null &&
               grep -q 'TIM_PHYSICS_TRAINING' /tmp/pc-parcours.js 2>/dev/null &&
               grep -q 'physicsTrainingPreviewSubmit' /tmp/pc-boot.js 2>/dev/null &&
               grep -q 'renderPhysicsExerciseDirectory' /tmp/pc-app.js 2>/dev/null &&
               grep -q 'Mode essai Parent' /tmp/pc-parcours.js 2>/dev/null &&
               grep -q 'TIM_PHYSICS_INLINE_PDF.originalFiles' /tmp/pc-documents.js 2>/dev/null &&
               grep -q 'Le PDF original du professeur' /tmp/pc-parcours.js 2>/dev/null; then
               ok=1
               break
            fi
            sleep 10
          done
          test "$ok" = 1
          echo "Pages et scripts de physique-chimie publiés."
      - name: Confirmer le backend actif et les réponses cachées
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://classeur-tim-v16.pages.dev"
          curl -fsSL --max-time 20 "$BASE/api/status" | tee /tmp/pc-status.json
          grep -q '"platform":"cloudflare-pages"' /tmp/pc-status.json
          grep -q '"available":true' /tmp/pc-status.json
          grep -q '"physicsParentPreview":true' /tmp/pc-status.json
          code=$(curl -sS -o /tmp/pc-secret -w '%{http_code}' --max-time 20 "$BASE/worker/physics-quiz-01.mjs")
          test "$code" = "404"
          echo "Serveur disponible et banque de réponses inaccessible par URL publique."
