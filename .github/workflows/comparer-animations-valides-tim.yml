name: Comparer visuels du classeur Tim
on:
  push:
    branches: [corriger-medias-animations-tim-20261111]
    paths:
      - '.github/workflows/comparer-animations-valides-tim.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pillow==11.3.0 --disable-pip-version-check
      - run: python scripts/check_animation_assets.py
      - uses: actions/upload-artifact@v4
        with:
          name: comparaison-images-animations-tim
          path: inspect-animation-media/
          retention-days: 7
