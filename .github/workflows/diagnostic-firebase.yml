name: Tests Firebase isolés (aucune publication)
on:
  push:
    branches: [tests-firebase-sans-publication]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firestore-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Installer les dépendances Firebase
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Tester la logique de notation hors ligne
        run: node --test functions/test/*.test.mjs
      - name: Tester les autorisations sur l'émulateur
        run: npm run test:rules
