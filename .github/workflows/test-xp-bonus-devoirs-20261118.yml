name: Tester correction XP Bonus devoirs
on:
  push:
    branches: [xp-bonus-devoirs-lecons-reference-20261118]
    paths:
      - '.github/workflows/test-xp-bonus-devoirs-20261118.yml'
      - 'functions/xp.mjs'
      - 'functions/test/xp.test.mjs'
      - 'xp-rules.js'
      - 'worker/server.mjs'
      - 'app.js'
permissions:
  contents: read
jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntaxe du moteur et des écrans
        run: |
          node --check functions/xp.mjs
          node --check functions/test/xp.test.mjs
          node --check xp-rules.js
          node --check worker/server.mjs
          node --check app.js
      - name: Barèmes vérifiés sur les notes de 0 à 10
        run: node --test functions/test/xp.test.mjs
      - name: Vérifier l'interface et le raccordement au serveur
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            import assert from "node:assert/strict";
            const app=fs.readFileSync("app.js","utf8");
            const server=fs.readFileSync("worker/server.mjs","utf8");
            const rules=fs.readFileSync("xp-rules.js","utf8");
            assert(app.includes("7–10/10 : +1 XP"));
            assert(app.includes("5–6/10 : +0,5 XP"));
            assert(app.includes("Aucun plafond quotidien"));
            assert(app.includes("Bonus devoirs : 7–10/10"));
            assert(app.includes("Bonus devoirs : 5–6/10"));
            const rewardModal=app.slice(app.indexOf("function makeRewardsTile(){"),app.indexOf("document.getElementById(\u0027rewards-close\u0027)"));
            assert(rewardModal.includes("Bonus devoirs : 7–10/10"));
            assert(rewardModal.includes("Bonus devoirs : 5–6/10"));
            assert(rewardModal.includes("Bonus devoirs : 0–4/10"));
            assert(server.includes("homeworkBonus:exercise.homeworkBonus===true"));
            assert(rules.includes("Number.isFinite(a.xp)?a.xp:bonusPoints(a)"));
            console.log("Barème et conservation des XP précédents : présence vérifiée");
          '
