name: Synchroniser les exercices espagnols via le compte Parent
on:
  push:
    branches: [main]
    paths:
      - 'outils/publier-entrainements-via-parent.cjs'
      - '.github/workflows/publier-entrainements-parent.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publication:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TIM_PARENT_EMAIL: ${{ secrets.TIM_PARENT_EMAIL }}
      TIM_PARENT_PASSWORD: ${{ secrets.TIM_PARENT_PASSWORD }}
      TIM_SITE_URL: https://classeur-tim-v16.pages.dev/
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier la connexion Parent existante sans dévoiler ses identifiants
        run: |
          test -n "$TIM_PARENT_EMAIL" || { echo "::error::Connexion Parent non configurée."; exit 1; }
          test -n "$TIM_PARENT_PASSWORD" || { echo "::error::Connexion Parent non configurée."; exit 1; }
      - name: Installer Chromium pour la publication sécurisée
        run: |
          mkdir -p /tmp/tim-parent-publish
          npm install --prefix /tmp/tim-parent-publish --no-audit --no-fund playwright
          /tmp/tim-parent-publish/node_modules/.bin/playwright install --with-deps chromium
      - name: Ajouter les entraînements manquants dans la base Firebase existante
        env:
          NODE_PATH: /tmp/tim-parent-publish/node_modules
        run: |
          node --test functions/test/spanish-training.test.mjs
          node outils/publier-entrainements-via-parent.cjs
      - name: Résultat
        if: always()
        run: |
          echo "La publication n'est validée que si le test Parent a relu les 150 identifiants depuis Firestore." >> "$GITHUB_STEP_SUMMARY"
