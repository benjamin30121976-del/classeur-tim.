name: Vérifier configuration de déploiement Cloudflare ENT
on:
  workflow_dispatch:
  push:
    branches: [ent-sso-probe-20261109]
    paths: [cloudflare-credentials-probe.txt]
permissions:
  contents: read
jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      CF_PRESENT: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      CF_ACCOUNT_PRESENT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      CF_ALT_PRESENT: ${{ secrets.CF_API_TOKEN != '' }}
      CF_ACCOUNT_ALT_PRESENT: ${{ secrets.CF_ACCOUNT_ID != '' }}
      CF_DEPLOY_PRESENT: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN != '' }}
    steps:
      - name: Détecter uniquement présence autorisations sans afficher les secrets
        run: |
          echo "AUTORISATION_CLOUDFLARE_API_TOKEN=$CF_PRESENT"
          echo "COMPTE_CLOUDFLARE_ID=$CF_ACCOUNT_PRESENT"
          echo "AUTORISATION_CF_API_TOKEN=$CF_ALT_PRESENT"
          echo "COMPTE_CF_ID=$CF_ACCOUNT_ALT_PRESENT"
          echo "AUTORISATION_DEPLOY_TOKEN=$CF_DEPLOY_PRESENT"
