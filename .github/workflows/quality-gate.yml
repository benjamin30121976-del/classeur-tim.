name: Qualite classeur Tim - controle des changements
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Recuperer la branche a tester
        uses: actions/checkout@v4
      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verifier ressources, pages et syntaxe
        run: node tools/qa/check-site.mjs
      - name: Tester les evaluations de mathematiques et les protections des tentatives
        run: node --test worker/test/math-training.test.mjs
      - name: Vérifier les 39 exercices d'espagnol, leurs corrections et les résultats Parent/Tim
        run: node --test tools/qa/spanish-exercise.test.mjs
      - name: Installer Chromium et Playwright
        run: |
          mkdir -p /tmp/tim-qa-browser
          npm install --prefix /tmp/tim-qa-browser --no-audit --no-fund playwright
          /tmp/tim-qa-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Tester la navigation sur la version de cette branche
        env:
          NODE_PATH: /tmp/tim-qa-browser/node_modules
          TIM_PREVIEW_URL: http://127.0.0.1:8765/
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/tim-qa-http.log 2>&1 &
          node tools/qa/smoke-browser.cjs
      - name: Archiver captures des tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: controles-classeur-mobile-et-ordinateur
          path: browser-qa-results/
          retention-days: 3
          if-no-files-found: warn
