name: Verifier les vrais PDF dans les lecons (Parent lecture seule)
on:
  pull_request:
    paths:
      - 'outils/auditer-pdf-reels-parent.cjs'
      - 'outils/auditer-affichage-auto-parent.cjs'
      - 'outils/auditer-tous-documents-ent-parent.cjs'
      - 'tools/test/documents-inline-20261118.test.mjs'
      - 'physique-chimie-inline-pdf.js'
      - 'tim-inline-ent-documents.js'
      - 'francais-documents.js'
      - 'anglais-documents.js'
      - 'svt-documents.js'
      - 'histoire-geographie-documents.js'
      - 'maths-parcours.js'
      - 'espagnol-ent-exact.js'
      - '.github/workflows/audit-pdf-reels-parent.yml'
  push:
    branches: [main]
    paths:
      - 'outils/auditer-pdf-reels-parent.cjs'
      - '.github/workflows/audit-pdf-reels-parent.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pdf-lecture-seule:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      TIM_PARENT_EMAIL: ${{ secrets.TIM_PARENT_EMAIL }}
      TIM_PARENT_PASSWORD: ${{ secrets.TIM_PARENT_PASSWORD }}
      TIM_SITE_URL: https://classeur-tim-v16.pages.dev/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vérifier syntaxe des sept matières et affichage sans clic
        run: |
          node --check physique-chimie-inline-pdf.js
          node --check tim-inline-ent-documents.js
          node --check francais-documents.js
          node --check anglais-documents.js
          node --check svt-documents.js
          node --check histoire-geographie-documents.js
          node --check maths-parcours.js
          node --check espagnol-ent-exact.js
          node --check outils/auditer-affichage-auto-parent.cjs
          node --check outils/auditer-pdf-reels-parent.cjs
          node --test tools/test/documents-inline-20261118.test.mjs
      - name: Verifier le programme de test
        run: node --check outils/auditer-pdf-reels-parent.cjs
      - name: Verifier l'acces Parent sans afficher les identifiants
        run: test -n "$TIM_PARENT_EMAIL" && test -n "$TIM_PARENT_PASSWORD"
      - name: Installer Chromium
        run: |
          npm install --prefix /tmp/tim-pdf-audit --no-audit --no-fund playwright
          if ! command -v google-chrome >/dev/null 2>&1 && ! command -v chromium >/dev/null 2>&1; then
            /tmp/tim-pdf-audit/node_modules/.bin/playwright install --with-deps chromium
          fi
      - name: Auditer les documents des sept matieres sans clic et sans ecriture
        env:
          NODE_PATH: /tmp/tim-pdf-audit/node_modules
        run: node outils/auditer-visibilite-documents-7-matieres.cjs
      - name: Ouvrir les PDF originaux sans les extraire ni enregistrer
        env:
          NODE_PATH: /tmp/tim-pdf-audit/node_modules
        run: node outils/auditer-pdf-reels-parent.cjs
      - name: Rendre les originaux dans le compte Parent avec code prepare et Chromium
        env:
          NODE_PATH: /tmp/tim-pdf-audit/node_modules
        run: node outils/auditer-affichage-auto-parent.cjs

      - name: Auditer chaque reference ENT et les cinq fichiers des 16-17 novembre
        env:
          NODE_PATH: /tmp/tim-pdf-audit/node_modules
        run: node outils/auditer-tous-documents-ent-parent.cjs
