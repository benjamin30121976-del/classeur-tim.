name: Contrôle XP Bonus devoirs réellement publié
on:
  push:
    branches: [verifier-xp-bonus-live-20261118]
    paths:
      - '.github/workflows/verifier-xp-bonus-live-20261118.yml'
      - 'outils/verifier-xp-bonus-live-20261118.cjs'
permissions:
  contents: read
jobs:
  lire-site-et-parent:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      TIM_PARENT_EMAIL: ${{ secrets.TIM_PARENT_EMAIL }}
      TIM_PARENT_PASSWORD: ${{ secrets.TIM_PARENT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vérifier syntaxe du contrôle
        run: node --check outils/verifier-xp-bonus-live-20261118.cjs
      - name: Installer Chromium Playwright existant
        run: |
          npm install --prefix /tmp/tim-xp-check --no-audit --no-fund playwright
          /tmp/tim-xp-check/node_modules/.bin/playwright install --with-deps chromium
      - name: Vérifier Cloudflare et Parent sans écriture
        env:
          NODE_PATH: /tmp/tim-xp-check/node_modules
        run: node outils/verifier-xp-bonus-live-20261118.cjs
