name: Corriger le dimanche +20 XP (sans toucher aux résultats)
on:
  push:
    branches:
      - corriger-animation-dimanche-20xp-20261111
    paths:
      - '.github/workflows/construire-dimanche-20xp.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer le moteur GIF
        run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Corriger uniquement le texte du dimanche
        run: python scripts/corriger_animation_dimanche.py
      - name: Contrôler le fichier corrigé
        run: |
          python - <<'PY'
          from PIL import Image
          a=Image.open('assets/animations/Tim_Defi_Du_Dimanche_20XP_Original.gif')
          b=Image.open('assets/animations/Tim_Dimanche_Hologramme_20XP_Gagne.gif')
          assert b.n_frames==a.n_frames
          assert b.size==a.size
          print('Dimanche GIF correct:',b.size,b.n_frames,'frames')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dimanche-hologramme-20xp-corrige
          path: assets/animations/Tim_Dimanche_Hologramme_20XP_Gagne.gif
          retention-days: 14
      - name: Enregistrer le nouveau média sur la branche de travail
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/animations/Tim_Dimanche_Hologramme_20XP_Gagne.gif
          if ! git diff --cached --quiet; then
            git commit -m "Add corrected Sunday hologram animation, +20 XP gained"
            git push origin HEAD:corriger-animation-dimanche-20xp-20261111
          fi
