name: Inspection Parent authentifiee
on:
  push:
    branches: [main]
    paths:
      - 'browser-requests/parent.json'
      - 'outils/inspecter-parent-securise.cjs'
      - 'worker/server.mjs'
  pull_request:
    paths:
      - 'browser-requests/parent.json'
      - 'outils/inspecter-parent-securise.cjs'
      - 'outils/auditer-thales-q9-parent.cjs'
      - 'outils/rectifier-thales-q9-parent.cjs'
      - 'outils/auditer-bonus-hg-parent.cjs'
      - 'functions/xp-week-exception.mjs'
      - 'functions/test/xp-week-exception.test.mjs'
      - 'outils/auditer-recotation-samedi-20261115.cjs'
      - 'outils/reviser-copie-samedi-parent.cjs'
      - 'outils/plein-credit-samedi-parent.cjs'
      - 'worker/saturday-20261114-full-credit.mjs'
      - 'worker/test/saturday-20261114-full-credit.test.mjs'
      - 'worker/saturday-20261114-review.mjs'
      - 'worker/server.mjs'
      - '.github/workflows/inspection-parent-authentifie.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: inspection-parent-authentifiee
  cancel-in-progress: true
jobs:
  parent:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TIM_PARENT_EMAIL: ${{ secrets.TIM_PARENT_EMAIL }}
      TIM_PARENT_PASSWORD: ${{ secrets.TIM_PARENT_PASSWORD }}
      TIM_SITE_URL: https://classeur-tim-v16.pages.dev/
      TIM_AUDIT_RECODING: '0'
      TIM_SUNDAY_AUDIT: ${{ github.event_name == 'push' && github.ref_name == 'main' && '1' || '0' }}
      TIM_SATURDAY_REVISE: 'off'
      TIM_SATURDAY_FULL_CREDIT: 'off'
      TIM_TH_Q9_APPLY: ${{ github.event_name == 'push' && github.ref_name == 'main' && '1' || '0' }}
      TIM_XP_CARRY_INSPECT: ${{ github.head_ref == 'exception-barre-xp-du-16-au-22-novembre-2026' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - name: Verifier la syntaxe JavaScript des exercices
        run: |
          node --check app.js
          node --check maths-parcours.js
          node --check maths-bis-data.js
          node --check worker/server.mjs
          node --check worker/maths-training-curriculum.mjs
          node --check worker/maths-training-extra.mjs
          node --check worker/test/math-training.test.mjs
          node --check outils/inspecter-parent-securise.cjs
          node --check outils/auditer-thales-q9-parent.cjs
          node --check outils/rectifier-thales-q9-parent.cjs
          node --check functions/xp-week-exception.mjs
          node --check outils/auditer-recotation-samedi-20261115.cjs
          node --check outils/reviser-copie-samedi-parent.cjs
          node --check outils/plein-credit-samedi-parent.cjs
          node --check worker/saturday-20261114-full-credit.mjs
          node --check worker/saturday-20261114-review.mjs
      - name: Tester les 23 évaluations et la sécurité des tentatives
        run: node --test worker/test/math-training.test.mjs worker/test/saturday-20261114-review.test.mjs worker/test/saturday-20261114-server.test.mjs worker/test/saturday-20261114-full-credit.test.mjs
      - name: Verifier la configuration des secrets sans les afficher
        id: verify
        run: |
          if [ -n "$TIM_PARENT_EMAIL" ] && [ -n "$TIM_PARENT_PASSWORD" ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
            echo 'Secrets de connexion presents.'
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'Secrets manquants : TIM_PARENT_EMAIL et TIM_PARENT_PASSWORD. Aucun test prive execute.'
          fi
      - name: Installer Chromium
        if: steps.verify.outputs.configured == 'true'
        run: |
          mkdir -p /tmp/tim-parent-browser
          npm install --prefix /tmp/tim-parent-browser --no-audit --no-fund playwright
          /tmp/tim-parent-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Vérifier la copie Thalès Q9 sans modification
        if: steps.verify.outputs.configured == 'true' && github.event_name == 'pull_request'
        env:
          NODE_PATH: /tmp/tim-parent-browser/node_modules
        run: node outils/auditer-thales-q9-parent.cjs
      - name: Rectifier en production le point Q9 de Thalès, après publication et accord du Parent
        if: steps.verify.outputs.configured == 'true' && github.event_name == 'push' && env.TIM_TH_Q9_APPLY == '1'
        env:
          NODE_PATH: /tmp/tim-parent-browser/node_modules
        run: node outils/rectifier-thales-q9-parent.cjs
      - name: Tester la vraie connexion Parent en lecture seule
        if: steps.verify.outputs.configured == 'true'
        env:
          NODE_PATH: /tmp/tim-parent-browser/node_modules
        run: node outils/inspecter-parent-securise.cjs
      - name: Vérifier si le bonus HG ancien a déjà une copie (Parent, lecture seule)
        if: always() && steps.verify.outputs.configured == 'true'
        env:
          NODE_PATH: /tmp/tim-parent-browser/node_modules
        run: node outils/auditer-bonus-hg-parent.cjs
      - name: Archiver uniquement les captures avec donnees individuelles masquees
        if: steps.verify.outputs.configured == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: inspection-parent-captures-masquees
          path: browser-parent-results/
          retention-days: 1
          if-no-files-found: warn
