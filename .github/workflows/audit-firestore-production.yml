name: Audit Firestore production - lecture seule
# Audit de la présence de corrigés dans les extensions de cours
on:
  push:
    branches: [audit-firestore-readonly-20261109]
    paths: ['.github/workflows/audit-firestore-production.yml']
permissions:
  contents: read
jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      TIM_PARENT_EMAIL: ${{ secrets.TIM_PARENT_EMAIL }}
      TIM_PARENT_PASSWORD: ${{ secrets.TIM_PARENT_PASSWORD }}
      TIM_STUDENT_EMAIL: ${{ secrets.TIM_STUDENT_EMAIL }}
      TIM_STUDENT_PASSWORD: ${{ secrets.TIM_STUDENT_PASSWORD }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Auditer les permissions reelles et verifier absence de divulgation des corriges sans modifier Firestore
        run: node outils/audit-firestore-securite.cjs
      - name: Verifier lecture seule et separations des roles sur Cloudflare
        run: node outils/audit-cloudflare-securite-lecture-seule.cjs
