name: Essai lecture ENT Tim

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Installer le client Skolengo (version figee)
        run: |
          python -m pip install --disable-pip-version-check requests beautifulsoup4
          mkdir -p skolengo
          touch skolengo/__init__.py
          BASE=https://raw.githubusercontent.com/infernalK/ha-skolengo/e9c9a84c0787991daa50a91c545386a75a38c631/custom_components/skolengo
          curl -fsSL "$BASE/api.py" -o skolengo/api.py
          curl -fsSL "$BASE/const.py" -o skolengo/const.py
      - name: Recuperer les devoirs les cours et les fichiers
        env:
          ENT_USERNAME: ${{ secrets.ENT_USERNAME }}
          ENT_PASSWORD: ${{ secrets.ENT_PASSWORD }}
          ENT_BIRTHDATE: ${{ secrets.ENT_BIRTHDATE }}
        run: python scripts/tim_ent_collect.py
      - name: Enregistrer les resultats
        run: |
          git config user.name "tim-ent-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ENT/tim
          if git diff --cached --quiet; then
            echo "Pas de modification."
          else
            git commit -m "Essai collecte ENT"
            git push
          fi
